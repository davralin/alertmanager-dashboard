services:
  valkey:
    image: ghcr.io/valkey-io/valkey:9.1.1@sha256:64e361b630ecf18dff7ca4df6a88e6eafc193687eb48cff2c7e0a293ab67d29a
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  receiver:
    build:
      context: .
      dockerfile: Containerfile
      target: receiver
    environment:
      VALKEY_ADDR: valkey:6379
    ports:
      - "8080:8080"
    read_only: true
    depends_on:
      valkey:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Containerfile
      target: dashboard
    environment:
      VALKEY_ADDR: valkey:6379
      STALE_AFTER: 90m
    ports:
      - "8081:8080"
    read_only: true
    depends_on:
      valkey:
        condition: service_healthy
