name: Weekly Image Scan

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 09:00 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        component: [receiver, dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy - image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_SKIP_VERSION_CHECK: "true"
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}-${{ matrix.component }}:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          # Soft mode: omit exit-code. Hard mode: add exit-code: '1'.
          format: sarif
          output: trivy-weekly-${{ matrix.component }}.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43  # v4
        with:
          sarif_file: trivy-weekly-${{ matrix.component }}.sarif
          category: trivy-weekly-${{ matrix.component }}
